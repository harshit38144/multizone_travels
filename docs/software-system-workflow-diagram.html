<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>End-to-End Software System Workflow</title>
  <style>
    :root {
      --bg: #ffffff;
      --grid: #e8edf5;
      --ink: #0f172a;
      --muted: #64748b;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --blue-border: #93c5fd;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --purple-border: #c4b5fd;
      --teal: #0d9488;
      --teal-soft: #f0fdfa;
      --teal-border: #5eead4;
      --line: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f1f5f9;
      font-family: "Segoe UI", "Inter", system-ui, sans-serif;
      color: var(--ink);
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(255,255,255,.92);
      border-bottom: 1px solid #e2e8f0;
      backdrop-filter: blur(8px);
    }
    .toolbar h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .01em;
    }
    .toolbar p {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    .toolbar button {
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .toolbar button:hover { background: #f8fafc; }
    .stage {
      padding: 24px;
      overflow: auto;
    }
    .canvas {
      width: 3840px;
      max-width: none;
      margin: 0 auto;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        var(--bg);
      background-size: 40px 40px, 40px 40px, auto;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, .08);
    }
    svg { display: block; width: 100%; height: auto; }
    @media print {
      .toolbar { display: none; }
      body, .stage { background: #fff; padding: 0; }
      .canvas { border: none; box-shadow: none; border-radius: 0; }
    }
  </style>
</head>
