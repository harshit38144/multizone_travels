; Allow larger quotation document uploads (Upload Document feature).
; Apache may need a restart after changes. If this file is ignored under mod_php,
; also raise upload_max_filesize / post_max_size in C:\xampp\php\php.ini.
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
